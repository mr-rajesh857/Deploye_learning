# =============================================================================
# Docker Compose — Employee Leave Management System
# =============================================================================
# Architecture:
#   app      → Unified Container (FastAPI backend + Next.js frontend on port 3000)
#   postgres → PostgreSQL 16
#   adminer  → Database Web UI (Adminer)
#
# Single Unified URL:
#   Frontend & API are accessible together at http://localhost:3000
#   (API endpoints: http://localhost:3000/api/..., Swagger: http://localhost:3000/docs)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Unified Application Container (Frontend + Backend)
  # ---------------------------------------------------------------------------
  app:
    image: ${APP_IMAGE:-leave-management-app}:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leave_management_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_PORT: 8000
      BACKEND_HOST: 127.0.0.1
      # Internal Docker service database connection
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-Leave_management}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-Leave_management}
      JWT_SECRET: ${JWT_SECRET:-supersecret-employee-leave-management-key-2026}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8085
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: leave_management_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-Leave_management}
    ports:
      - "${HOST_DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-Leave_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Adminer — Database Web UI
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: leave_management_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8085}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

# =============================================================================
volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge

